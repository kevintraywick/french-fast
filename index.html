<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Fast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div id="game-container">
        <div id="top-bar">
            <div class="top-bar-left">
                <div id="round-display">
                    <button id="prev-round-btn" title="Previous round" aria-label="Previous round"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></button>
                    <span id="round-label">Round <span id="round-number">1</span><span id="round-theme"></span></span>
                    <button id="skip-round-btn" title="Skip to next round" aria-label="Next round"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
                </div>
                <div id="round-timer"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="timer-value">00:00</span></div>
                <div id="match-counter"><div id="match-progress"><i></i></div><span><span id="matched-count">0</span> / <span id="total-count">50</span> pairs</span></div>
                <div id="new-words-flash"></div>
            </div>
            <div id="speed-control" class="hidden" role="radiogroup" aria-label="Speed">
                <label class="speed-btn" title="Slow"><input type="radio" name="speed" value="0.5" aria-label="Slow"><img src="./icons/1f422.svg" alt=""></label>
                <label class="speed-btn" title="Medium"><input type="radio" name="speed" value="1.0" aria-label="Medium" checked><img src="./icons/1f407.svg" alt=""></label>
                <label class="speed-btn" title="Fast"><input type="radio" name="speed" value="2.0" aria-label="Fast"><img src="./icons/1f406.svg" alt=""></label>
            </div>
            <div class="top-bar-right">
                <span id="top-score">0</span>
                <div id="voice-control">
                    <button id="voice-test-btn" title="Toggle sound"></button>
                </div>
                <button id="theme-toggle-btn" title="Toggle dark/light mode" aria-label="Toggle dark mode"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/></svg></button>
                <button id="pause-btn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13m7-13v13"/></svg><span>Pause</span></button>
            </div>
        </div>
        
        <div id="game-area">
            <div id="center-icon-container">
                <div id="center-icon-circle"></div>
            </div>
            <div id="croissant-shooter">
                <div id="croissant-ship">🥐</div>
            </div>
            <div id="paddle-container">
                <div id="paddle"></div>
            </div>
            <div id="paddle-hint">← → move · Space/⇧Space cycle word · Catch emojis!</div>
            <div id="breakout-score">0</div>
            <div id="streak-counter"></div>
            <div id="color-flash"></div>
        </div>
        
        <div id="round-countdown"></div>

        <div id="progress-container">
            <div id="progress-bar-container">
                <div id="progress-bar" style="height: 0%"></div>
            </div>
        </div>
        
        <div id="pause-overlay">
            <div id="pause-text">Paused</div>
            <div id="pause-hint">Click anywhere to resume</div>
        </div>
        
        <div id="round-complete-overlay">
            <div id="round-complete-text">ROUND 1 COMPLETE</div>
            <div id="round-time-result" style="font-size:18px;color:#333;font-variant-numeric:tabular-nums;">Time: <span id="round-time-value">00:00.0</span></div>
            <button id="next-round-btn">Start Round 2</button>
        </div>
        
        <div id="validation-overlay">
            <div id="validation-text">Match the Pairs</div>
            <div id="validation-subtitle">(Don't forget to enable audio and select a voice)</div>
            <div id="validation-status"></div>
        </div>
        
        <div id="audio-setup-overlay">
            <div id="audio-setup-message">
                <div style="font-size: 28px; font-weight: 600; color: #333; margin-bottom: 12px;">🔊 Audio Setup</div>
                <div style="font-size: 16px; color: #666;">For the best experience, enable audio and select a French voice</div>
            </div>
        </div>
        
        <div id="round-title-overlay">
            <div id="round-title-text">Round 3</div>
            <div id="round-title-instructions"></div>
        </div>
    </div>

    <!-- Splash Page -->
    <div id="splash-overlay">
        <img id="splash-logo" src="./logo_artboard.jpg" alt="Learn French Fast" />
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
